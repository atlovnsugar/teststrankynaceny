name: Refresh energy data (full archive)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 5'
  push:
    branches: [main]
    paths:
      - 'scripts/update_data.py'
      - 'scripts/validate_data.py'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'

permissions:
  contents: write

concurrency:
  group: energy-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install ETL dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline parser regression checks
        run: python scripts/test_data_parsers.py

      - name: Rebuild full public archives
        run: python scripts/update_data.py

      - name: Show refresh diagnostics
        if: always()
        run: |
          if [ -f data/refresh-report.json ]; then
            cat data/refresh-report.json
          else
            echo 'No refresh-report.json was produced.'
          fi

      - name: Validate refreshed archives
        run: python scripts/validate_data.py

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          echo "### Energy data refresh" >> "$GITHUB_STEP_SUMMARY"
          python scripts/validate_data.py >> "$GITHUB_STEP_SUMMARY"
          if git diff --cached --quiet; then
            echo 'No data changes to commit.'
          else
            git commit -m 'chore(data): refresh energy price datasets'
            git push
          fi
