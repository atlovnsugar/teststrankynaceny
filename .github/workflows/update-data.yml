name: Refresh energy data (full archive)

on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 5'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/update-data.yml'
      - 'site/energy_system.js'
      - 'site/energy_system.css'
      - 'site/system_section.html'

permissions:
  contents: write
  actions: write

concurrency:
  group: energy-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source-only repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.13'
          cache: pip

      - name: Install ETL dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline parser checks
        run: python scripts/test_data_parsers.py

      - name: Rebuild primary public archives
        run: python scripts/update_data.py

      - name: Rebuild energy-system archives
        run: python scripts/refresh_energy_system.py

      - name: Show refresh diagnostics
        if: always()
        run: |
          echo '--- refresh-report.json ---'
          if [ -f data/refresh-report.json ]; then cat data/refresh-report.json; else echo 'No refresh-report.json'; fi
          echo '--- generated archive state ---'
          python - <<'PY'
          import json
          from pathlib import Path
          d=Path('data')
          for name in ['fuel-history.json','gas.json','oil.json','fx.json','supply.json','electricity-system.json']:
              p=d/name
              print(f'{name}: {p.stat().st_size if p.exists() else "MISSING"} bytes')
          PY

      - name: Validate primary archives
        run: python scripts/validate_data.py

      - name: Validate energy-system archives
        run: python scripts/validate_energy_system.py

      - name: Commit generated data only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/
          if git diff --cached --quiet; then
            echo 'No generated data changes to commit.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            git commit -m 'chore(data): refresh energy archives'
            git push
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          fi
