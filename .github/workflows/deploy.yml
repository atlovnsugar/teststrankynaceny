name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh energy data (full archive)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout generated data commit
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 1

      - name: Check source and generated archives
        run: |
          node --version
          python --version
          node --check site/app.js
          node --check scripts/build.mjs
          test -f data/current.json
          test -f data/fuel-history.json
          test -f data/gas.json
          test -f data/oil.json
          test -f data/fx.json
          test -f data/supply.json
          test -f data/electricity-system.json
          test -f data/infrastructure/gas-pipelines.geojson
          test -f data/infrastructure/oil-pipelines.geojson

      - name: Validate primary archives
        run: python scripts/validate_data.py

      - name: Validate energy system archives
        run: python scripts/validate_energy_system.py

      - name: Build static site
        run: node scripts/build.mjs

      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
